
name: Build Crypto G APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Crypto_G.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 Cython==0.29.33

      - name: Check project archive
        run: |
          if [ ! -f Crypto_G.zip ]; then
            echo "ERROR: Crypto_G.zip not found in repository root"
            exit 1
          fi
          mkdir -p extracted
          unzip -q Crypto_G.zip -d extracted

      - name: Configure Android build
        run: |
          SPEC=$(find extracted -name buildozer.spec -print -quit)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          echo "Using spec: $SPEC"

          sed -i '/^[[:space:]]*android\.archs\?[[:space:]]*=/d' "$SPEC"
          sed -i '/^[[:space:]]*android\.accept_sdk_license[[:space:]]*=/d' "$SPEC"

          printf '\nandroid.archs = armeabi-v7a\n' >> "$SPEC"
          printf 'android.accept_sdk_license = True\n' >> "$SPEC"

          cat "$SPEC"

      - name: Build APK
        run: |
          SPEC=$(find extracted -name buildozer.spec -print -quit)
          cd "$(dirname "$SPEC")"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-G-APK
          path: extracted/**/bin/*.apk
          if-no-files-found: error
